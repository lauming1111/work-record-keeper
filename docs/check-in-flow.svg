<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" font-family="Inter, -apple-system, 'Helvetica Neue', Arial, sans-serif">
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="14" flood-color="#0f172a" flood-opacity="0.10"/>
    </filter>
  </defs>

  <rect width="1600" height="900" fill="#f7f8fa"/>

  <!-- heading -->
  <text x="90" y="104" font-size="46" font-weight="800" fill="#111827">One tap in. One tap out.</text>
  <text x="90" y="150" font-size="24" fill="#98a2b3">Work Record Keeper &#183; logging a shift is now two taps, not two time pickers</text>

  <!-- state 1 -->
  <g filter="url(#shadow)">
    <rect x="90" y="228" width="410" height="300" rx="22" fill="#ffffff" stroke="#e6eef8" stroke-width="2"/>
  </g>
  <text x="130" y="284" font-size="19" fill="#98a2b3">Today &#183; 2026-08-22</text>
  <text x="130" y="326" font-size="30" font-weight="700" fill="#111827">Not started</text>
  <rect x="130" y="360" width="330" height="76" rx="15" fill="#2ac48a"/>
  <text x="295" y="408" font-size="27" font-weight="700" fill="#ffffff" text-anchor="middle">Check In</text>
  <text x="130" y="482" font-size="19" fill="#98a2b3">Nothing logged yet for today.</text>

  <!-- arrow 1 -->
  <line x1="516" y1="398" x2="568" y2="398" stroke="#98a2b3" stroke-width="4"/>
  <path d="M568 386 L588 398 L568 410 z" fill="#98a2b3"/>
  <text x="552" y="372" font-size="19" font-weight="700" fill="#4f8dfd" text-anchor="middle">tap</text>

  <!-- state 2 -->
  <g filter="url(#shadow)">
    <rect x="600" y="228" width="410" height="300" rx="22" fill="#ffffff" stroke="#e6eef8" stroke-width="2"/>
  </g>
  <text x="640" y="284" font-size="19" fill="#98a2b3">Today &#183; 2026-08-22</text>
  <text x="640" y="326" font-size="30" font-weight="700" fill="#111827">Checked in at 09:00</text>
  <rect x="640" y="360" width="330" height="76" rx="15" fill="#ffb020"/>
  <text x="805" y="408" font-size="27" font-weight="700" fill="#111827" text-anchor="middle">Check Out</text>
  <text x="640" y="482" font-size="19" fill="#98a2b3">Card shrinks. Undo sits alongside.</text>

  <!-- arrow 2 -->
  <line x1="1026" y1="398" x2="1078" y2="398" stroke="#98a2b3" stroke-width="4"/>
  <path d="M1078 386 L1098 398 L1078 410 z" fill="#98a2b3"/>
  <text x="1062" y="372" font-size="19" font-weight="700" fill="#4f8dfd" text-anchor="middle">tap</text>

  <!-- state 3 -->
  <g filter="url(#shadow)">
    <rect x="1110" y="228" width="410" height="300" rx="22" fill="#ffffff" stroke="#e6eef8" stroke-width="2"/>
  </g>
  <text x="1150" y="284" font-size="19" fill="#98a2b3">Today &#183; 2026-08-22</text>
  <text x="1150" y="326" font-size="30" font-weight="700" fill="#111827">Done for today</text>
  <rect x="1150" y="372" width="228" height="52" rx="12" fill="#f7f8fa" stroke="#e6eef8" stroke-width="2"/>
  <text x="1264" y="405" font-size="21" font-weight="700" fill="#28c76f" text-anchor="middle">09:00 &#8211; 17:00 &#183; 7.50h</text>
  <rect x="1392" y="372" width="88" height="52" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
  <text x="1436" y="405" font-size="20" font-weight="600" fill="#98a2b3" text-anchor="middle">Undo</text>
    <text x="1150" y="482" font-size="19" fill="#98a2b3">Shrinks to a strip. Undo steps back.</text>

  <!-- footnotes -->
  <g>
    <rect x="90" y="600" width="440" height="180" rx="18" fill="#ffffff" stroke="#e6eef8" stroke-width="2"/>
    <circle cx="128" cy="646" r="7" fill="#28c76f"/>
    <text x="152" y="653" font-size="22" font-weight="700" fill="#111827">Stamps Toronto time</text>
    <text x="122" y="694" font-size="19" fill="#98a2b3">Not the device clock, so the time always</text>
    <text x="122" y="722" font-size="19" fill="#98a2b3">agrees with the date it is filed under.</text>
  </g>

  <g>
    <rect x="580" y="600" width="440" height="180" rx="18" fill="#ffffff" stroke="#e6eef8" stroke-width="2"/>
    <circle cx="618" cy="646" r="7" fill="#ffc857"/>
    <text x="642" y="653" font-size="22" font-weight="700" fill="#111827">Break comes off for you</text>
    <text x="612" y="694" font-size="19" fill="#98a2b3">09:00 to 17:00 less a 30 minute lunch</text>
    <text x="612" y="722" font-size="19" fill="#98a2b3">is 7.50 paid hours, then real tax on top.</text>
  </g>

  <g>
    <rect x="1070" y="600" width="440" height="180" rx="18" fill="#ffffff" stroke="#e6eef8" stroke-width="2"/>
    <circle cx="1108" cy="646" r="7" fill="#ff5c7c"/>
    <text x="1132" y="653" font-size="22" font-weight="700" fill="#111827">Undo, not a dead end</text>
    <text x="1102" y="694" font-size="19" fill="#98a2b3">No stamp button to mis-tap, and Undo</text>
    <text x="1102" y="722" font-size="19" fill="#98a2b3">steps back one stamp at a time.</text>
  </g>

  <text x="90" y="842" font-size="20" fill="#98a2b3">lauming1111.github.io/work-record-keeper</text>
</svg>
